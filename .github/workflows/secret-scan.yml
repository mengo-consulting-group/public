name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Self-contained copy of the shared reusable-secret-scan.yml
# (mengo-consulting-group/github-workflows). A public repository cannot call a reusable
# workflow stored in a private repository, so the steps are inlined here, with extra
# hardening because this repository is public. Keep the scan behaviour in sync with the
# shared workflow (AL-771).
jobs:
  gitleaks:
    name: Detect Secrets (Gitleaks)
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: "8.30.1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Verify the tarball against the release checksums before extracting it.
      - name: Install Gitleaks
        run: |
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${BASE}/${TARBALL}"
          curl -sSfLO "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${TARBALL}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${TARBALL}" -C /usr/local/bin gitleaks

      # --redact: this repository is public, so Actions logs are readable by anyone.
      # Event values reach the script through env, not ${{ }} inside run.
      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            echo "Running Gitleaks on PR commits..."
            gitleaks detect \
              --config .gitleaks.toml \
              --log-opts "${BASE_SHA}..${HEAD_SHA}" \
              --redact \
              --verbose
          else
            echo "Running Gitleaks on full history..."
            gitleaks detect \
              --config .gitleaks.toml \
              --redact \
              --verbose
          fi
