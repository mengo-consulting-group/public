name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secret-scan:
    # Shared workflow (mengo-consulting-group/github-workflows). Uses this repo's own
    # .gitleaks.toml, so it needs no secrets.
    uses: mengo-consulting-group/github-workflows/.github/workflows/reusable-secret-scan.yml@main
